<div class="auth-page">
  <h1>Iniciar sesión</h1>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <label>
      Email
      <input
        type="email"
        formControlName="email"
        autocomplete="email"
        inputmode="email"
        autocapitalize="none"
        autocorrect="off"
        spellcheck="false"
      />
    </label>

    <label>
      Contraseña
      <input type="password" formControlName="password" autocomplete="current-password" />
    </label>

    @if (errorMessage()) {
      <p class="error">{{ errorMessage() }}</p>
    }

    @if (waking()) {
      <div class="wake-notice" role="status" aria-live="polite">
        <span class="spinner" aria-hidden="true"></span>
        <div>
          <strong>El servidor está arrancando…</strong>
          <p>
            Puede tardar hasta 3 minutos. Reintento {{ attempt() }} de 10 en
            {{ retryCountdown() }} s.
          </p>
        </div>
      </div>
      <button type="button" class="link-button" (click)="cancelRetry()">Cancelar</button>
    } @else {
      <button type="submit" [disabled]="submitting()">
        @if (submitting()) {
          <span class="spinner spinner-sm" aria-hidden="true"></span> Entrando…
        } @else {
          Entrar
        }
      </button>
    }
  </form>

  <p>¿No tienes cuenta? <a routerLink="/register">Regístrate</a></p>
</div>
