<div class="notifications-panel">
  <button type="button" class="notifications-panel__toggle" (click)="toggle()">
    Notificaciones
    @if (unreadCount() > 0) {
      <span class="notifications-panel__badge">{{ unreadCount() }}</span>
    }
  </button>

  @if (open()) {
    <div class="notifications-panel__dropdown">
      @if (notifications().length === 0) {
        <p class="notifications-panel__empty">Sin notificaciones</p>
      } @else {
        <ul class="notifications-panel__list">
          @for (notification of notifications(); track notification.id) {
            <li
              class="notifications-panel__item"
              [class.notifications-panel__item--unread]="!notification.readAt"
              (click)="markAsRead(notification)"
            >
              <p>{{ notification.message }}</p>
              <span class="notifications-panel__date">{{ notification.createdAt | date: 'short' }}</span>
            </li>
          }
        </ul>
      }
    </div>
  }
</div>
